<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#155b87">
    <title>Daily kitchen summary</title>
    <link rel="stylesheet" href="lunch.css">
    <script src="admin-i18n.js" defer></script>
    <script src="kitchen.js" defer></script>
</head>
<body>
<div class="app-shell kitchen-shell">
    <header class="app-header">
        <a class="back-button" href="index.html" aria-label="Back">‹</a>
        <div class="header-title">
            <h1>Daily kitchen summary</h1>
            <span>Production totals and order details</span>
        </div>
        <button class="save-link" id="printButton" type="button">Print</button>
    </header>
    <main>
        <section class="kitchen-toolbar kitchen-toolbar-extended">
            <div><label for="daySelect">Day</label><input id="daySelect" type="date"></div>
            <div class="kitchen-search"><label for="employeeSearch">Find employee</label><input id="employeeSearch" type="search" placeholder="Search name or employee number"></div>
            <button class="secondary-button" id="todayButton" type="button">Today</button>
            <button class="secondary-button" id="refreshButton" type="button">Refresh</button>
        </section>
        <section class="summary-cards">
            <article><span>Total lunches</span><strong id="totalLunches">0</strong></article>
            <article><span>Employee</span><strong id="employeeLunches">0</strong></article>
            <article><span>Guest</span><strong id="guestLunches">0</strong></article>
            <article><span>Meal choices</span><strong id="mealTypes">0</strong></article>
        </section>
        <section class="kitchen-panel">
            <div class="panel-heading"><div><h2 id="selectedDayHeading">Daily totals</h2><p>Click a meal to show who ordered it</p></div><span class="deadline-badge">Final after 08:30</span></div>
            <div id="mealSummary"></div>
            <div class="empty-state" id="emptyState" hidden><strong>No matching orders</strong><span>There are no orders for this day or search.</span></div>
        </section>
        <p class="poc-note" id="dataNote"></p>
    </main>

    <dialog id="cancelDialog" class="cancel-order-dialog">
        <form id="cancelForm">
            <div class="dialog-heading"><h2 id="cancelTitle">Cancel lunch</h2><button id="closeCancelDialog" type="button" aria-label="Close">×</button></div>
            <div class="cancel-order-context">
                <div><span id="cancelPersonLabel">Employee</span><strong id="cancelPerson"></strong></div>
                <div><span id="cancelMealLabel">Dish</span><strong id="cancelMeal"></strong></div>
                <div><span id="cancelDateLabel">Date</span><strong id="cancelDate"></strong></div>
                <div id="cancelTaskRow" hidden><span id="cancelTaskLabel">Work task / project</span><strong id="cancelTask"></strong></div>
            </div>
            <label><span id="cancelQuantityLabel">Quantity to cancel</span><select id="cancelQuantity" required></select><small id="cancelAvailable"></small></label>
            <label><span id="cancelReasonLabel">Reason</span><select id="cancelReason" required>
                <option value="INSUFFICIENT_PORTIONS">Insufficient portions</option>
                <option value="EMPLOYEE_REQUEST">Employee requested removal</option>
                <option value="EMPLOYEE_ABSENT">Employee absent</option>
                <option value="WRONG_DISH">Wrong dish</option>
                <option value="KITCHEN_CORRECTION">Kitchen correction</option>
                <option value="OTHER">Other</option>
            </select></label>
            <label><span id="cancelReasonTextLabel">Additional information</span><textarea id="cancelReasonText" maxlength="500" rows="3"></textarea></label>
            <label><span id="cancelByLabel">Cancelled by</span><input id="cancelledBy" maxlength="100" value="Kitchen" required></label>
            <div id="cancelError" class="cancel-form-error" role="alert" hidden></div>
            <div class="dialog-actions"><button id="cancelBack" type="button" class="secondary-button">Back</button><button id="confirmCancellation" type="submit" class="danger-button">Cancel lunch</button></div>
        </form>
    </dialog>
    <div class="toast" id="toast"></div>
</div>
</body>
</html>
