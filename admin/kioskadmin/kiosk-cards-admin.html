<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café Kiosk cards</title><link rel="stylesheet" href="cafe-kiosk-admin.css"><script src="kiosk-cards-admin.js" defer></script></head><body><main class="admin-page"><header class="admin-header"><a href="index.html" aria-label="Back">‹</a><div><h1 id="pageTitle">Kiosk cards</h1><p id="pageSubtitle">Employee and external cards</p></div><div class="header-actions"><select id="languageSelect"><option value="en">EN</option><option value="sv">SV</option><option value="fi">FI</option></select><button id="newCard" class="primary">New card</button></div></header><section class="toolbar"><input id="searchInput" type="search" placeholder="Search"><select id="ownerFilter"><option value="">All owners</option><option value="employee">Employee</option><option value="external">External</option></select><label class="checkbox"><input id="showInactive" type="checkbox"> <span id="inactiveLabel">Show inactive</span></label></section><div id="status" class="status"></div><section id="cardList" class="card-grid"></section></main><dialog id="cardDialog"><form id="cardForm" class="dialog-body"><div class="dialog-head"><h2 id="cardDialogTitle">Kiosk card</h2><button type="button" data-close="cardDialog">×</button></div><input id="cardId" type="hidden"><div class="form-grid"><label class="field"><span>Card number</span><input id="cardNumber" maxlength="100" required></label><label class="field"><span>Owner type</span><select id="ownerType"><option value="Employee">Employee</option><option value="External">External</option></select></label><label class="field employee-owner"><span>Employee number</span><input id="employeeNo" type="number" min="1"></label><label class="field external-owner hidden"><span>External account</span><select id="externalAccountId"></select></label><label class="field full"><span>Display name override</span><input id="displayNameOverride" maxlength="150"></label><label class="field"><span>Valid from</span><input id="validFrom" type="datetime-local"></label><label class="field"><span>Valid until</span><input id="validUntil" type="datetime-local"></label><label class="checkbox full"><input id="cardActive" type="checkbox" checked> <span>Active</span></label></div><div class="dialog-actions"><button type="button" class="secondary" data-close="cardDialog">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><div id="toast" class="toast"></div></body></html>
