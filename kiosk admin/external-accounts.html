<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café Kiosk external accounts</title><link rel="stylesheet" href="cafe-kiosk-admin.css"><script src="external-accounts.js" defer></script></head><body><main class="admin-page"><header class="admin-header"><a href="index.html" aria-label="Back">‹</a><div><h1 id="pageTitle">External accounts</h1><p id="pageSubtitle">Prepaid, postpaid and invoice accounts</p></div><div class="header-actions"><select id="languageSelect"><option value="en">EN</option><option value="sv">SV</option><option value="fi">FI</option></select><button id="newAccount" class="primary">New account</button></div></header><section class="toolbar"><input id="searchInput" type="search" placeholder="Search"><select id="modeFilter"><option value="">All modes</option><option>Prepaid</option><option>Postpaid</option><option>Invoice</option></select><label class="checkbox"><input id="showInactive" type="checkbox"> <span id="inactiveLabel">Show inactive</span></label></section><div id="status" class="status"></div><section id="accountList" class="card-grid"></section></main>
<dialog id="accountDialog"><form id="accountForm" class="dialog-body"><div class="dialog-head"><h2 id="accountDialogTitle">External account</h2><button type="button" data-close="accountDialog">×</button></div><input id="accountId" type="hidden"><div class="form-grid"><label class="field"><span>Display name</span><input id="displayName" maxlength="150" required></label><label class="field"><span>Company</span><input id="companyName" maxlength="200"></label><label class="field"><span>Account mode</span><select id="accountMode" required><option>Prepaid</option><option>Postpaid</option><option>Invoice</option></select></label><label class="field credit-field"><span>Credit limit (€)</span><input id="creditLimit" type="number" min="0" step="0.01"></label><label class="field"><span>External reference</span><input id="externalReference" maxlength="100"></label><label class="field"><span>Invoice reference</span><input id="invoiceReference" maxlength="100"></label><label class="field"><span>Contact name</span><input id="contactName" maxlength="150"></label><label class="field"><span>Contact email</span><input id="contactEmail" type="email" maxlength="254"></label><label class="field"><span>Valid from</span><input id="validFrom" type="date"></label><label class="field"><span>Valid until</span><input id="validUntil" type="date"></label><label class="field full"><span>Notes</span><textarea id="notes" maxlength="1000"></textarea></label><label class="checkbox full"><input id="accountActive" type="checkbox" checked> <span>Active</span></label></div><div class="dialog-actions"><button type="button" class="secondary" data-close="accountDialog">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="moneyDialog"><form id="moneyForm" class="dialog-body"><div class="dialog-head"><h2 id="moneyTitle">Account transaction</h2><button type="button" data-close="moneyDialog">×</button></div><input id="moneyAccountId" type="hidden"><input id="moneyOperation" type="hidden"><div class="form-grid"><label class="field"><span>Amount (€)</span><input id="moneyAmount" type="number" min="0.01" step="0.01" required></label><label class="field"><span>Recorded by</span><input id="moneyCreatedBy" maxlength="100" value="Kitchen" required></label><label class="field full"><span>Description</span><input id="moneyDescription" maxlength="500"></label><label class="field"><span>Settlement reference</span><input id="moneyReference" maxlength="100"></label><label class="field invoice-number"><span>Invoice number</span><input id="moneyInvoice" maxlength="100"></label></div><div class="dialog-actions"><button type="button" class="secondary" data-close="moneyDialog">Cancel</button><button class="primary" type="submit">Save transaction</button></div></form></dialog>
<dialog id="ledgerDialog"><div class="dialog-body"><div class="dialog-head"><h2 id="ledgerTitle">Ledger</h2><button type="button" data-close="ledgerDialog">×</button></div><div id="ledgerSummary" class="metrics"></div><div id="ledgerList" class="ledger"></div><div class="dialog-actions"><button class="secondary" type="button" data-close="ledgerDialog">Close</button></div></div></dialog><div id="toast" class="toast"></div></body></html>
