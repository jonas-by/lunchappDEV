<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Kiosk</title>
  <link rel="stylesheet" href="bulla.css">
  <script src="order.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="kiosk-header">
      <div class="mark">B</div>
      <div class="customer-copy">
        <h1 id="customerName">Café Kiosk</h1>
        <span id="customerDetails"></span>
      </div>
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="en">EN</option><option value="sv">SV</option><option value="fi">FI</option>
      </select>
      <span id="timeoutCounter" class="timeout-counter">60 s</span>
      <button id="cancelButton" class="cancel-button" type="button">Cancel</button>
    </header>
    <main>
      <section class="intro">
        <div><span class="eyebrow">Café Kiosk</span><h2 id="chooseTitle">Choose products</h2><p id="chooseHelp">Use plus and minus, then complete the purchase.</p></div>
        <strong id="cartTotal">€0.00</strong>
      </section>
      <div id="status" class="kiosk-status" role="status"></div>
      <section class="product-columns" aria-live="polite">
        <div id="productColumn1" class="product-column"></div>
        <div id="productColumn2" class="product-column"></div>
      </section>
      <div id="emptyState" class="empty-state" hidden>No products are available.</div>
    </main>
    <footer>
      <button id="clearButton" class="footer-secondary" type="button" disabled>Clear</button>
      <div class="footer-summary"><strong id="selectionSummary">No products selected</strong><span id="statusText">Select a product to continue</span></div>
      <button id="buyButton" type="button" disabled>Buy</button>
    </footer>
    <div id="toast" class="toast" role="status"></div>
  </div>
</body>
</html>
